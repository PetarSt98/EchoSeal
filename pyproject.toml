# -------------------------------------------------------------------------
#  RTWM – Real-Time Audio Watermarking
#  Uses PEP 621 metadata + Setuptools build backend
# -------------------------------------------------------------------------

[project]
name            = "rtwm"
version         = "0.2.0"
description     = "Real-Time ultrasonic audio watermarking (TX + RX)"
readme          = "README.md"
authors         = [
  { name = "RTWM Team", email = "contact@example.com" }
]
license         = { text = "MIT" }
requires-python = ">=3.12"

# ------------- runtime dependencies --------------------------------------
# NB: the polar codec lives in-tree (rtwm.fastpolar); no external FEC package.
#     tkinter ships with CPython (apt: python3-tk) and is not a pip dependency.
dependencies = [
  "numpy>=1.25",
  "scipy>=1.11",
  "sounddevice>=0.4",
  "soundfile>=0.12",
  "cryptography>=42.0",        # ChaCha20-Poly1305 AEAD + AES-CTR PN
]

# ------------- optional / dev extras -------------------------------------
[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=24.1",
  "flake8>=7.0",
  "mypy>=1.8",
  "matplotlib>=3.8",
  "hypothesis>=6.0",           # Property-based testing
  "nox>=2024.0",              # Test automation
]

# ------------- console entry-points --------------------------------------
#  After install, run `echoseal-tx` / `echoseal-rx` (or the `rtwm-*` aliases).
[project.scripts]
echoseal-tx = "tx_app:main"
echoseal-rx = "rx_app:main"
rtwm-tx = "tx_app:main"
rtwm-rx = "rx_app:main"

# ------------- links ------------------------------------------------------
[project.urls]
Homepage     = "https://github.com/your-org/rtwm"
BugTracker   = "https://github.com/your-org/rtwm/issues"
Documentation = "https://github.com/your-org/rtwm/wiki"

# -------------------------------------------------------------------------
#  tooling configs (Black shown as example)
# -------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests (detector / full round-trip) that take minutes to run",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# -------------------------------------------------------------------------
#  build backend
# -------------------------------------------------------------------------
[build-system]
requires      = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
