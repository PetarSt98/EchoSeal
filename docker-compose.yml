services:
  echoseal-tx:
    build: .
    image: echoseal:latest
    command: echoseal-tx --key ${KEY:?set KEY to a 64-char hex key}
    devices:
      - "/dev/snd:/dev/snd"        # ALSA / PulseAudio on Linux
    environment:
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    # volumes: ["$XDG_RUNTIME_DIR/pulse:/run/user/1000/pulse"]  # if using Pulse

  echoseal-rx:
    image: echoseal:latest
    command: echoseal-rx --key ${KEY:?set KEY to a 64-char hex key} --audio /data/recording.wav
    volumes:
      - ./samples:/data            # mount recordings here
